<title>The Art Walk — Art Galleries Across India</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--cream:#F4E8D8;--dark:#0A0A0A;--accent:#9C4E22;--muted:#9C8D7A;--card:#fff;--border:#E5D8C6;}
html,body{height:100%;width:100%;overflow:hidden;}
body{font-family:'DM Sans',sans-serif;color:var(--dark);display:flex;flex-direction:column;background:var(--cream);}
.topbar{background:var(--dark);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:500;flex-shrink:0;}
.logo{font-family:'Playfair Display',serif;font-size:18px;color:#fff;white-space:nowrap;}
.logo span{color:var(--accent);}
.search-wrap{flex:1;position:relative;}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:none;background:rgba(255,255,255,0.12);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;}
.search-wrap input::placeholder{color:rgba(255,255,255,0.38);}
.search-wrap input:focus{background:rgba(255,255,255,0.18);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;opacity:.5;}
.loc-btn{width:38px;height:38px;border-radius:10px;border:none;background:rgba(255,255,255,0.12);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.loc-btn:active,.loc-btn.active{background:var(--accent);}
.filters{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;flex-shrink:0;background:var(--dark);scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fpill{padding:5px 13px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.55);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;}
.fpill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.view-container{flex:1;position:relative;min-height:0;isolation:isolate;}
.view{position:absolute;inset:0;display:none;flex-direction:column;}
.view.active{display:flex;}
#map{flex:1;min-height:0;}
.list-header{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.list-title{font-family:'Playfair Display',serif;font-size:16px;}
.count-pill{background:var(--accent);color:#fff;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;}
.nearby-note{font-size:11px;color:var(--muted);padding:0 16px 8px;flex-shrink:0;}
.glist{flex:1;overflow-y:auto;padding:0 12px 110px;min-height:0;scrollbar-width:none;}
.glist::-webkit-scrollbar{display:none;}

.gcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;display:flex;align-items:center;gap:12px;}
.gcard:active,.gcard.active{border-color:var(--accent);}
.gcard-thumb-wrap{position:relative;flex-shrink:0;}
.gcard-thumb{width:46px;height:46px;border-radius:12px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;border:1px solid var(--border);box-sizing:border-box;padding:3px;background-origin:content-box;}
.gcard-ring-dot{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;}
.gcard-body{flex:1;min-width:0;}
.gcard-name{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gcard-meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.dist-badge{font-size:10px;background:#E8F4FF;color:#1860A0;padding:1px 6px;border-radius:8px;font-weight:500;}
.pop-badge{font-size:10px;background:#FFF0E0;color:#B0600A;padding:1px 6px;border-radius:8px;font-weight:500;}

.detail{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,0.18);z-index:2200;max-height:82vh;overflow-y:auto;}
.detail.open{display:block;}
.detail-handle{padding:10px 0 4px;display:flex;justify-content:center;}
.detail-photo{width:100%;height:150px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;box-sizing:border-box;padding:14px;}
.detail-inner{padding:14px 18px 28px;position:relative;}
.dbadge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:10px;display:inline-block;margin-bottom:8px;}
.detail-name{font-family:'Playfair Display',serif;font-size:20px;line-height:1.25;margin-bottom:2px;}
.detail-sub{font-size:13px;color:var(--muted);margin-bottom:4px;}
.detail-rating{font-size:13px;color:#B07010;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.detail-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;margin-bottom:6px;}
.detail-row .ico{font-size:15px;flex-shrink:0;margin-top:1px;}
.hours-toggle{font-size:12px;color:var(--accent);cursor:pointer;margin:4px 0 6px;display:block;}
.hours-list{font-size:12px;color:var(--muted);line-height:1.9;display:none;margin-bottom:8px;}
.hours-list.open{display:block;}
.mode-strip{display:flex;gap:6px;margin:12px 0 10px;}
.mmode{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--border);background:#fff;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;color:var(--muted);transition:all .2s;}
.mmode.active{background:var(--dark);border-color:var(--dark);color:#fff;}
.dir-input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--cream);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:10px;color:var(--dark);}
.dir-input:focus{border-color:var(--accent);}
.btn-dir{width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-close-d{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.85);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--dark);z-index:2;}
.overlay{display:none;position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.25);}
.overlay.open{display:block;}

.fab-loc{position:fixed;right:14px;bottom:158px;z-index:2000;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.13);border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.fab-loc:active{background:#fff3ee;}

.highlight-card{position:fixed;left:12px;right:12px;bottom:78px;z-index:2010;background:#fff;border-radius:16px;padding:8px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;}
.hc-photo{width:44px;height:44px;border-radius:12px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;flex-shrink:0;border:2px solid var(--cream);box-sizing:border-box;padding:3px;background-origin:content-box;}
.hc-body{flex:1;min-width:0;}
.hc-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hc-sub{font-size:11px;color:var(--muted);}
.hc-chev{font-size:20px;color:var(--muted);flex-shrink:0;}

.bottom-nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:2020;background:var(--dark);border-radius:20px;display:flex;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);}
.nav-btn{flex:1;background:none;border:none;color:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:10px;cursor:pointer;transition:all .2s;}
.nav-btn .nav-ico{font-size:17px;}
.nav-btn.active{background:var(--accent);color:#fff;}

.loading{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s;}
.loading.done{opacity:0;pointer-events:none;}
.loading-the{font-family:'Playfair Display',serif;font-size:20px;font-style:italic;color:rgba(255,255,255,.85);line-height:1;}
.loading-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:46px;color:#fff;line-height:1.02;text-align:center;margin-bottom:10px;}
.loading-rule{width:130px;height:1px;background:rgba(255,255,255,.5);margin:2px 0 10px;}
.loading-tagline{font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.6);text-transform:uppercase;margin-bottom:20px;}
.loading-tagline b{color:var(--accent);font-weight:500;}
.loading-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:30px;}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.no-results{text-align:center;padding:40px 20px;color:var(--muted);}
.no-results .big{font-size:36px;margin-bottom:8px;}
.user-pulse{width:16px;height:16px;background:#3B82F6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(59,130,246,.2);}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-the">The</div>
  <div class="loading-logo">Art<br>Walk</div>
  <div class="loading-rule"></div>
  <div class="loading-tagline">Art Galleries <b>&bull;</b> Exhibitions <b>&bull;</b> Open Calls</div>
  <div class="loading-sub">Finding galleries near you…</div>
  <div class="spinner"></div>
</div>

<div class="topbar">
  <div class="logo">The Art <span>Walk</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search galleries, areas…" oninput="filterGalleries()">
  </div>
  <button class="loc-btn" id="locBtn" onclick="goToMyLocation()">📍</button>
</div>
<div class="filters">
  <button class="fpill active" onclick="setFilter('all',this)">All</button>
  <button class="fpill" onclick="setFilter('Delhi',this)">🎨 Delhi</button>
  <button class="fpill" onclick="setFilter('Mumbai',this)">🌊 Mumbai</button>
  <button class="fpill" onclick="setFilter('Bangalore',this)">🌳 Bangalore</button>
  <button class="fpill" onclick="setFilter('Hyderabad',this)">🕌 Hyderabad</button>
  <button class="fpill" onclick="setFilter('Chennai',this)">🏖️ Chennai</button>
  <button class="fpill" onclick="setFilter('Kerala',this)">🌴 Kerala</button>
</div>

<div class="view-container">
  <div id="mapView" class="view active">
    <div id="map"></div>
  </div>
  <div id="listView" class="view">
    <div class="list-header">
      <div class="list-title">Art Galleries</div>
      <span class="count-pill" id="countBadge">0</span>
    </div>
    <div class="nearby-note" id="nearbyNote"></div>
    <div class="glist" id="galleryList"></div>
  </div>
</div>

<button class="fab-loc" id="fabLoc" onclick="goToMyLocation()">📍</button>

<div class="highlight-card" id="highlightCard" onclick="onHighlightTap()">
  <div class="hc-photo" id="hcPhoto"></div>
  <div class="hc-body">
    <div class="hc-title" id="hcTitle">Loading galleries…</div>
    <div class="hc-sub" id="hcSub"></div>
  </div>
  <div class="hc-chev">›</div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" id="navMap" onclick="switchView('map')"><span class="nav-ico">🗺️</span><span>Map</span></button>
  <button class="nav-btn" id="navList" onclick="switchView('list')"><span class="nav-ico">📋</span><span>List</span></button>
  <button class="nav-btn" onclick="openExternal('whatsapp')"><span class="nav-ico"><svg viewBox="0 0 32 32" width="17" height="17" fill="#25D366"><path d="M16.04 3C9.37 3 3.96 8.4 3.96 15.06c0 2.23.6 4.32 1.65 6.12L3 29l7.99-2.56a12.05 12.05 0 0 0 5.05 1.11h.01c6.67 0 12.08-5.4 12.08-12.06C28.13 8.83 22.71 3 16.04 3zm0 21.88h-.01a10 10 0 0 1-5.1-1.4l-.36-.21-4.74 1.52 1.55-4.61-.24-.38a9.92 9.92 0 0 1-1.53-5.24c0-5.5 4.47-9.98 9.98-9.98 2.67 0 5.17 1.04 7.06 2.93a9.9 9.9 0 0 1 2.93 7.05c0 5.5-4.48 9.98-9.99 9.98h.05z"/><path d="M21.24 17.7c-.29-.15-1.7-.84-1.96-.93-.26-.1-.46-.15-.65.14-.19.29-.75.93-.92 1.12-.17.19-.34.22-.63.07-.29-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.74-1.63-2.03-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.19-.29.29-.48.1-.19.05-.36-.02-.51-.07-.15-.65-1.57-.9-2.15-.24-.57-.48-.5-.65-.5-.17 0-.36-.01-.55-.01-.19 0-.51.07-.77.36-.26.29-1 .98-1 2.39s1.03 2.77 1.17 2.96c.14.19 2.02 3.09 4.9 4.33.68.3 1.22.47 1.63.6.68.22 1.31.19 1.8.11.55-.08 1.7-.69 1.94-1.36.24-.67.24-1.24.17-1.36-.07-.12-.26-.19-.55-.34z"/></svg></span><span>Community</span></button>
  <button class="nav-btn" onclick="openExternal('instagram')"><span class="nav-ico">📸</span><span>Instagram</span></button>
</div>

<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail" id="detailSheet">
  <div class="detail-handle"><div class="handle"></div></div>
  <div class="detail-photo" id="dPhoto"></div>
  <div class="detail-inner">
    <button class="btn-close-d" onclick="closeDetail()">✕</button>
    <div class="dbadge" id="dRegion"></div>
    <div class="detail-name" id="dName"></div>
    <div class="detail-sub" id="dSub"></div>
    <div class="detail-rating"><span id="dRating"></span><span class="pop-badge" id="dPopBadge" style="display:none;">🔥 Popular</span></div>
    <div class="detail-row"><span class="ico">📍</span><span id="dAddress"></span></div>
    <span class="hours-toggle" onclick="toggleHours()">🕐 Show opening hours</span>
    <div class="hours-list" id="dHours"></div>
    <div class="mode-strip">
      <button class="mmode active" onclick="setMode('driving',this)">🚗 Drive</button>
      <button class="mmode" onclick="setMode('walking',this)">🚶 Walk</button>
      <button class="mmode" onclick="setMode('cycling',this)">🚴 Cycle</button>
    </div>
    <input class="dir-input" id="fromInput" placeholder="Your location (tap 📍 for GPS)">
    <button class="btn-dir" onclick="getDirections()">🧭 Get directions</button>
  </div>
</div>

<script>
const galleries=[
  // ══════════════════════════════════

  {name:"Lalit Kala Akademi",area:"Mandi House",city:"New Delhi",region:"Delhi",lat:28.6247,lng:77.2311,address:"35 Firozeshah Rd, Mandi House",rating:4.5,hours:["Mon–Sun: 11am–7pm"],photo:"https://cdn.jsdelivr.net/gh/theartwalk/map@main/logos/Lalit%20Kala%20Akademi%20.png"},

const regionColors={Delhi:"#C4622D",Mumbai:"#2050C0",Bangalore:"#3A7A20",Hyderabad:"#A06010",Chennai:"#7040B0",Kerala:"#207050"};
const badgeStyle={Delhi:"background:#FFF0E8;color:#C4622D",Mumbai:"background:#E8F0FF;color:#2050C0",Bangalore:"background:#EDFEE8;color:#306020",Hyderabad:"background:#FFF8E0;color:#906010",Chennai:"background:#F5E8FF;color:#6030A0",Kerala:"background:#E8FFF5;color:#20705A"};

/// Most galleries don't have a verified real photo yet. Rather than show a
// random/incorrect stock photo, we render a clean generic gallery icon
// (tinted to the region's color) as a placeholder. Add a real `photo` URL
// field to any gallery object to use an actual photo instead.
function genericIcon(region){
  const c=regionColors[region]||"#888";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="${c}" fill-opacity="0.15"/><rect x="24" y="30" width="52" height="38" rx="3" fill="none" stroke="${c}" stroke-width="4"/><circle cx="38" cy="44" r="5" fill="${c}"/><path d="M24 60 L40 46 L54 58 L64 48 L76 60" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `data:image/svg+xml,${encodeURIComponent(svg)}`;
}
function photoUrl(g){
  return g.photo || genericIcon(g.region);
}

let map,markers=[],userMarker=null,routeLine=null,travelMode="driving",activeFilter="all",activeIdx=null;
let userLat=null,userLng=null,currentList=galleries,currentView="map",highlightIdx=null;

function distKm(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function fmtDist(km){
  return km<1?(Math.round(km*1000)+"m"):(km.toFixed(1)+"km");
}

function initMap(){
  map=L.map("map",{zoomControl:false}).setView([28.57,77.21],12);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:'© OpenStreetMap © Carto',maxZoom:19}).addTo(map);
  galleries.forEach((g,i)=>{
    const m=L.marker([g.lat,g.lng],{icon:makeIcon(g.region,false,photoUrl(g))}).addTo(map);
    m.on("click",()=>openDetail(i));
    markers.push(m);
  });
  filterGalleries();
  getUserLocation(true);
}

function makeIcon(region,big,photo){
  const c=regionColors[region]||"#888",s=big?58:44,r=big?16:12,p=big?7:5;
  return L.divIcon({className:"",html:`<div style="width:${s}px;height:${s}px;border-radius:${r}px;background-color:#fff;background-image:url('${photo}');background-repeat:no-repeat;background-position:center;background-size:contain;box-sizing:border-box;padding:${p}px;background-origin:content-box;border:${big?3:2.5}px solid ${c};box-shadow:0 3px 10px rgba(0,0,0,.35);"></div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
}

function getUserLocation(onLoad){
  if(!navigator.geolocation)return void document.getElementById("loading").classList.add("done");
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    placeUserMarker(userLat,userLng);
    if(onLoad){
      map.flyTo([userLat,userLng],14,{duration:1.5});
      filterGalleries(); // re-sort by distance
    }
    document.getElementById("fromInput").value=`${userLat.toFixed(6)}, ${userLng.toFixed(6)}`;
    document.getElementById("loading").classList.add("done");
  },()=>{
    document.getElementById("loading").classList.add("done");
  },{timeout:8000,enableHighAccuracy:true});
}

function goToMyLocation(){
  document.getElementById("locBtn").classList.add("active");
  setTimeout(()=>document.getElementById("locBtn").classList.remove("active"),1500);
  if(!navigator.geolocation)return alert("Location not available");
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    placeUserMarker(userLat,userLng);
    map.flyTo([userLat,userLng],14,{duration:1});
    document.getElementById("fromInput").value=`${userLat.toFixed(6)}, ${userLng.toFixed(6)}`;
    filterGalleries();
  },()=>alert("Could not get location. Please enable location access."),{enableHighAccuracy:true});
}

function placeUserMarker(lat,lng){
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.marker([lat,lng],{icon:L.divIcon({className:"",html:'<div class="user-pulse"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
}

function switchView(v){
  currentView=v;
  document.getElementById("mapView").classList.toggle("active",v==="map");
  document.getElementById("listView").classList.toggle("active",v==="list");
  document.getElementById("navMap").classList.toggle("active",v==="map");
  document.getElementById("navList").classList.toggle("active",v==="list");
  document.getElementById("fabLoc").style.display=v==="map"?"flex":"none";
  updateHighlightCard();
  if(v==="map")setTimeout(()=>map.invalidateSize(),80);
}

function openExternal(kind){
  const urls={
    instagram:"https://www.instagram.com/theartwalk.in/",
    whatsapp:"https://chat.whatsapp.com/Kirekmo0Qiw9Tzpc8uxdt7"
  };
  window.open(urls[kind],"_blank");
}

function updateHighlightCard(){
  const card=document.getElementById("highlightCard");
  const list=currentList;
  if(currentView!=="map"||!list.length){card.style.display="none";return;}
  card.style.display="flex";
  let g,subtext;
  if(userLat!==null){
    g=list.slice().sort((a,b)=>distKm(userLat,userLng,a.lat,a.lng)-distKm(userLat,userLng,b.lat,b.lng))[0];
    subtext=fmtDist(distKm(userLat,userLng,g.lat,g.lng))+" away · tap for directions";
  }else{
    g=list[Math.floor(Math.random()*list.length)];
    subtext="Enable location to find galleries near you";
  }
  document.getElementById("hcPhoto").style.backgroundImage=`url('${photoUrl(g)}')`;
  document.getElementById("hcTitle").textContent=g.name;
  document.getElementById("hcSub").textContent=subtext;
  highlightIdx=galleries.indexOf(g);
}

function onHighlightTap(){
  if(highlightIdx!==null)openDetail(highlightIdx);
}

function renderList(list){
  document.getElementById("countBadge").textContent=list.length;
  const noteEl=document.getElementById("nearbyNote");
  const el=document.getElementById("galleryList");
  if(!list.length){noteEl.textContent="";el.innerHTML=`<div class="no-results"><div class="big">🎨</div>No galleries found</div>`;return;}

  // Sort by distance if we have location
  if(userLat!==null){
    list=list.slice().sort((a,b)=>distKm(userLat,userLng,a.lat,a.lng)-distKm(userLat,userLng,b.lat,b.lng));
    noteEl.textContent="Sorted by distance from your location";
  } else {
    noteEl.textContent="Enable location to see nearest galleries first";
  }

  el.innerHTML=list.map(g=>{
    const i=galleries.indexOf(g);
    const dist=userLat!==null?fmtDist(distKm(userLat,userLng,g.lat,g.lng)):null;
    const popular=g.rating>=4.8?'<span class="pop-badge">🔥 Popular</span>':"";
    return`<div class="gcard" id="card-${i}" onclick="openDetail(${i})">
      <div class="gcard-thumb-wrap">
        <div class="gcard-thumb" style="background-image:url('${photoUrl(g)}')"></div>
        <div class="gcard-ring-dot" style="background:${regionColors[g.region]||'#888'}"></div>
      </div>
      <div class="gcard-body">
        <div class="gcard-name">${g.name}</div>
        <div class="gcard-meta">
          <span>${g.area}</span>
          <span>⭐ ${g.rating}</span>
          ${dist?`<span class="dist-badge">📍 ${dist}</span>`:""}
          ${popular}
        </div>
      </div>
    </div>`;
  }).join("");
}

function openDetail(i){
  const g=galleries[i];activeIdx=i;
  document.querySelectorAll(".gcard").forEach(c=>c.classList.remove("active"));
  const card=document.getElementById(`card-${i}`);
  if(card){card.classList.add("active");card.scrollIntoView({behavior:"smooth",block:"nearest"});}
  document.getElementById("dPhoto").style.backgroundImage=`url('${photoUrl(g)}')`;
  document.getElementById("dRegion").textContent=g.region;
  document.getElementById("dRegion").style=badgeStyle[g.region]||"";
  document.getElementById("dName").textContent=g.name;
  const dist=userLat!==null?" · "+fmtDist(distKm(userLat,userLng,g.lat,g.lng))+" away":"";
  document.getElementById("dSub").textContent=`${g.area} · ${g.city}${dist}`;
  document.getElementById("dRating").textContent=`⭐ ${g.rating} rating`;
  document.getElementById("dPopBadge").style.display=g.rating>=4.8?"inline-block":"none";
  document.getElementById("dAddress").textContent=g.address;
  const hoursEl=document.getElementById("dHours");
  hoursEl.innerHTML=g.hours&&g.hours.length?g.hours.join("<br>"):"Hours not available";
  hoursEl.classList.remove("open");
  document.querySelector(".hours-toggle").textContent="🕐 Show opening hours";
  markers.forEach((m,idx)=>m.setIcon(makeIcon(galleries[idx].region,false,photoUrl(galleries[idx]))));
  markers[i].setIcon(makeIcon(g.region,true,photoUrl(g)));
  map.flyTo([g.lat,g.lng],16,{duration:1});
  document.getElementById("detailSheet").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}

function toggleHours(){
  const h=document.getElementById("dHours");
  const t=document.querySelector(".hours-toggle");
  h.classList.toggle("open");
  t.textContent=h.classList.contains("open")?"🕐 Hide hours":"🕐 Show opening hours";
}

function closeDetail(){
  document.getElementById("detailSheet").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
  if(activeIdx!==null)markers[activeIdx].setIcon(makeIcon(galleries[activeIdx].region,false,photoUrl(galleries[activeIdx])));
  activeIdx=null;
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}
}

function setMode(mode,btn){
  travelMode=mode;
  document.querySelectorAll(".mmode").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

function getDirections(){
  if(activeIdx===null)return;
  const g=galleries[activeIdx];
  const from=document.getElementById("fromInput").value.trim();
  if(!from){getUserLocation(false);setTimeout(()=>{const v=document.getElementById("fromInput").value.trim();if(v)launch(g,v);else alert("Please enable location or enter your address.");},2000);return;}
  launch(g,from);
}

function launch(g,from){
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}
  const modeMap={driving:"driving",walking:"walking",cycling:"bicycling"};
  let originParam;
  if(from.match(/^-?\d+\.?\d*,\s*-?\d+\.?\d*$/)){
    const[la,lo]=from.split(",").map(s=>s.trim());
    originParam=`${la},${lo}`;
    routeLine=L.polyline([[parseFloat(la),parseFloat(lo)],[g.lat,g.lng]],{color:"#C4622D",weight:3,dashArray:"8,5",opacity:.85}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[80,80]});
  }else{originParam=encodeURIComponent(from);}
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${encodeURIComponent(g.lat+","+g.lng)}&travelmode=${modeMap[travelMode]||"driving"}`,"_blank");
}

function setFilter(region,btn){
  activeFilter=region;
  document.querySelectorAll(".fpill").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  filterGalleries();
}

function filterGalleries(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  let filtered=galleries.filter(g=>{
    const mr=activeFilter==="all"||g.region===activeFilter;
    const ms=!q||g.name.toLowerCase().includes(q)||g.city.toLowerCase().includes(q)||g.area.toLowerCase().includes(q);
    return mr&&ms;
  });
  currentList=filtered;
  markers.forEach((m,i)=>{
    const g=galleries[i];
    const mr=activeFilter==="all"||g.region===activeFilter;
    const ms=!q||g.name.toLowerCase().includes(q)||g.city.toLowerCase().includes(q)||g.area.toLowerCase().includes(q);
    mr&&ms?(!map.hasLayer(m)&&m.addTo(map)):(map.hasLayer(m)&&map.removeLayer(m));
  });
  renderList(filtered);
  updateHighlightCard();
}

initMap();
